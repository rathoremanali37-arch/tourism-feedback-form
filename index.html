<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tourism Campaign Feedback Collector</title>
    <link rel="stylesheet" href="styles.css">
</head>
     <div class="container">
        <header>
            <h1>Tourism Campaign Feedback</h1>
            <p>Help us improve our tourism campaigns by sharing your thoughts!</p>
        </header>

        <main>
            <form id="feedbackForm">
                <div class="form-group">
                    <label for="campaign">Select Campaign:</label>
                    <select id="campaign" name="campaign" required>
                        <option value="">Choose a campaign...</option>
                        <option value="beach-paradise">Beach Paradise 2024</option>
                        <option value="mountain-adventure">Mountain Adventure</option>
                        <option value="city-exploration">City Exploration</option>
                        <option value="cultural-heritage">Cultural Heritage</option>
                        <option value="eco-tourism">Eco-Tourism Initiative</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="name">Your Name:</label>
                    <input type="text" id="name" name="name" required>
                </div>

                <div class="form-group">
                    <label for="email">Email Address:</label>
                    <input type="email" id="email" name="email" required>
                </div>

                <div class="form-group">
                    <label>Rating:</label>
                    <div class="rating">
                        <input type="radio" id="star5" name="rating" value="5" required>
                        <label for="star5" title="5 stars">★</label>
                        <input type="radio" id="star4" name="rating" value="4">
                        <label for="star4" title="4 stars">★</label>
                        <input type="radio" id="star3" name="rating" value="3">
                        <label for="star3" title="3 stars">★</label>
                        <input type="radio" id="star2" name="rating" value="2">
                        <label for="star2" title="2 stars">★</label>
                        <input type="radio" id="star1" name="rating" value="1">
                        <label for="star1" title="1 star">★</label>
                    </div>
                </div>

                <div class="form-group">
                    <label for="comments">Comments:</label>
                    <textarea id="comments" name="comments" rows="4" placeholder="Share your experience..."></textarea>
                </div>

                <button type="submit" class="submit-btn">Submit Feedback</button>
            </form>

            <div id="feedbackList">
                <h2>Recent Feedback</h2>
                <div id="feedbackItems"></div>
            </div>
        </main>
    </div>

    <script src="script.js"></script>
</body>
</html>
